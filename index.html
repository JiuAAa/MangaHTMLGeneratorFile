<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga HTML Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Arial', sans-serif;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="file"]:focus {
            border-color: #667eea;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .file-info {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Manga HTML Generator</h1>
        
        <div class="input-group">
            <label for="title">Gallery Title:</label>
            <input type="text" id="title" placeholder="e.g., My Manga Collection">
        </div>
        
        <div class="input-group">
            <label for="images">Upload Images (支持多选):</label>
            <input type="file" id="images" accept="image/*" multiple>
            <div class="file-info">选择一个或多个图片文件</div>
        </div>
        
        <button onclick="generate()">Generate HTML</button>
        
        <div id="message"></div>
    </div>

    <script>
        function generate() {
            var title = document.getElementById('title').value.trim();
            var files = document.getElementById('images').files;
            var messageDiv = document.getElementById('message');
            
            if (!title) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Please enter a title';
                return;
            }
            
            if (files.length === 0) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Please select at least one image';
                return;
            }
            
            var processedCount = 0;
            var base64Images = [];
            
            Array.from(files).forEach(function(file, index) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    base64Images[index] = e.target.result;
                    processedCount++;
                    
                    if (processedCount === files.length) {
                        var html = makeHTML(base64Images, title);
                        downloadHTML(html, 'my_manga.html');
                        
                        messageDiv.className = 'message success';
                        messageDiv.textContent = '✅ Successfully generated! Downloading...';
                    }
                };
                reader.onerror = function() {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ Error reading file: ' + file.name;
                };
                reader.readAsDataURL(file);
            });
        }
        
        function makeHTML(base64Images, title) {
            var footer = '<div class="footer"><p><b>防失联</b> <a href="https://t.me/BGG_Home" target="_blank">@BGG_Home</a></p></div>';
            
            var html = '<!DOCTYPE html>' +
                '<html>' +
                '<head>' +
                    '<meta charset="UTF-8">' +
                    '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">' +
                    '<meta http-equiv="X-UA-Compatible" content="ie=edge">' +
                    '<title>' + title + '</title>' +
                    '<style>' +
                        '* { margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; box-sizing: border-box; }' +
                        'html, body { height: 100%; width: 100%; overflow-x: hidden; -webkit-touch-callout: none; }' +
                        'body { background: linear-gradient(135deg, #0f0c1d 0%, #1a0e2e 25%, #16213e 50%, #1a0e2e 75%, #0f0c1d 100%); background-attachment: fixed; color: #e0d9ff; font-family: Arial, sans-serif; padding: 0; position: relative; }' +
                        'body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0.2)), radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0.3)), radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0.2)), radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0.2)), radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,0.2)); background-repeat: repeat; background-size: 200px 200px; animation: twinkle 5s infinite; opacity: 0.6; pointer-events: none; z-index: 1; }' +
                        '@keyframes twinkle { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.8; } }' +
                        '.main { position: relative; z-index: 2; max-width: 100%; width: 100%; padding: 20px; margin: 0 auto; background: rgba(15, 12, 29, 0.8); min-height: 100vh; display: flex; flex-direction: column; }' +
                        '@media (min-width: 768px) { .main { max-width: 800px; margin: 0 auto; padding: 30px; border-radius: 8px; background: rgba(20, 15, 40, 0.9); box-shadow: 0 0 40px rgba(138, 43, 226, 0.3), inset 0 0 40px rgba(138, 43, 226, 0.1); } }' +
                        'h1 { text-align: center; margin-bottom: 30px; padding-bottom: 15px; font-size: 28px; color: #b19cd9; text-shadow: 0 0 20px rgba(177, 156, 217, 0.5), 0 0 40px rgba(138, 43, 226, 0.3); border-bottom: 2px solid; border-image: linear-gradient(90deg, #7b2cbf, #c77dff, #7b2cbf) 1; animation: glow 2s ease-in-out infinite; }' +
                        '@keyframes glow { 0%, 100% { text-shadow: 0 0 20px rgba(177, 156, 217, 0.5), 0 0 40px rgba(138, 43, 226, 0.3); } 50% { text-shadow: 0 0 30px rgba(177, 156, 217, 0.8), 0 0 50px rgba(138, 43, 226, 0.5); } }' +
                        '.imgs { display: flex; flex-direction: column; gap: 20px; width: 100%; padding: 10px 0; }' +
                        '.img { width: 100%; max-width: 100%; height: auto; cursor: pointer; border-radius: 8px; pointer-events: auto; border: 2px solid rgba(199, 125, 255, 0.3); box-shadow: 0 0 15px rgba(199, 125, 255, 0.2), 0 0 30px rgba(138, 43, 226, 0.1); transition: all 0.3s ease; display: block; }' +
                        '.img:hover { box-shadow: 0 0 25px rgba(199, 125, 255, 0.5), 0 0 50px rgba(138, 43, 226, 0.3); border-color: rgba(199, 125, 255, 0.6); transform: translateY(-2px); }' +
                        '.img:active { transform: translateY(0); }' +
                        '.footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(199, 125, 255, 0.2); text-align: center; }' +
                        '.footer p { font-size: 16px; color: #a89bb8; line-height: 1.6; }' +
                        '.footer a { color: #c77dff; text-decoration: none; font-weight: bold; pointer-events: auto; cursor: pointer; transition: all 0.3s; text-shadow: 0 0 10px rgba(199, 125, 255, 0.5); }' +
                        '.footer a:hover { color: #e0aaff; text-shadow: 0 0 15px rgba(199, 125, 255, 0.8), 0 0 25px rgba(138, 43, 226, 0.5); }' +
                        '#light { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 12, 29, 0.98); z-index: 999; align-items: center; justify-content: center; overflow: hidden; }' +
                        '#light.on { display: flex; }' +
                        '#light img { max-width: 90%; max-height: 90%; object-fit: contain; width: auto; height: auto; pointer-events: auto; }' +
                        '#close { position: absolute; top: 20px; right: 20px; color: #e0d9ff; font-size: 36px; cursor: pointer; background: rgba(123, 44, 191, 0.6); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1000; border: 2px solid rgba(199, 125, 255, 0.4); transition: all 0.3s; box-shadow: 0 0 15px rgba(199, 125, 255, 0.4); }' +
                        '#close:hover { background: rgba(123, 44, 191, 0.9); box-shadow: 0 0 25px rgba(199, 125, 255, 0.7); }' +
                        '#info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #e0d9ff; background: rgba(20, 15, 40, 0.8); padding: 12px 18px; border-radius: 6px; font-size: 13px; pointer-events: none; border: 1px solid rgba(199, 125, 255, 0.3); box-shadow: 0 0 15px rgba(199, 125, 255, 0.3); text-shadow: 0 0 10px rgba(199, 125, 255, 0.4); }' +
                        '.arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 36px; color: rgba(224, 217, 255, 0.5); cursor: pointer; padding: 15px 10px; z-index: 1000; transition: all 0.3s; border: 2px solid rgba(199, 125, 255, 0.2); border-radius: 6px; background: rgba(123, 44, 191, 0.3); }' +
                        '.arrow:hover { color: rgba(224, 217, 255, 0.9); box-shadow: 0 0 20px rgba(199, 125, 255, 0.6); background: rgba(123, 44, 191, 0.6); border-color: rgba(199, 125, 255, 0.6); }' +
                        '.arrow-left { left: 10px; }' +
                        '.arrow-right { right: 10px; }' +
                        '@media (max-width: 480px) { h1 { font-size: 22px; margin-bottom: 20px; padding-bottom: 10px; } .imgs { gap: 15px; } #info { font-size: 12px; padding: 10px 14px; bottom: 10px; } .arrow { font-size: 28px; padding: 12px 8px; } }' +
                    '</style>' +
                '</head>' +
                '<body>' +
                    '<div class="main">' +
                        '<h1>📚 ' + title + '</h1>' +
                        '<div class="imgs" id="imgs"></div>' +
                        footer +
                    '</div>' +
                    '<div id="light">' +
                        '<div class="arrow arrow-left" id="prevBtn">❮</div>' +
                        '<div class="arrow arrow-right" id="nextBtn">❯</div>' +
                        '<div id="close">×</div>' +
                        '<img id="pic">' +
                        '<div id="info"><span id="page">1/1</span> | 缩放: <span id="zoom">100</span>% | 滚轮缩放 | 左右键/滑动翻页</div>' +
                    '</div>' +
                    '<script>' +
                        'document.addEventListener("contextmenu",function(e){e.preventDefault();return false},true);' +
                        'document.addEventListener("copy",function(e){e.preventDefault();return false},true);' +
                        'document.addEventListener("cut",function(e){e.preventDefault();return false},true);' +
                        'document.addEventListener("dragstart",function(e){e.preventDefault();return false},true);' +
                        'document.addEventListener("drop",function(e){e.preventDefault();return false},true);' +
                        'document.addEventListener("keydown",function(e){var blocked=false;if(e.key==="F12"){blocked=true}if(e.ctrlKey&&e.shiftKey&&(e.key==="I"||e.key==="J"||e.key==="C")){blocked=true}if(e.ctrlKey&&e.key==="U"){blocked=true}if(e.ctrlKey&&(e.key==="S"||e.key==="P")){blocked=true}if(e.ctrlKey&&e.key==="Shift"&&e.key==="K"){blocked=true}if(blocked){e.preventDefault();return false}},true);' +
                        'document.addEventListener("selectstart",function(e){if(e.target.tagName!=="A"){e.preventDefault()}},true);' +
                        'document.body.style.webkitTouchCallout="none";' +
                        'document.addEventListener("mousedown",function(e){if(e.button===2||e.button===1){e.preventDefault()}},true);' +
                        'window.oncontextmenu=function(){return false};' +
                        'var zoom=1,currentIndex=0,urls=["' + base64Images.join('","') + '"];' +
                        'var pic=document.getElementById("pic"),light=document.getElementById("light"),close=document.getElementById("close");' +
                        'var zoomText=document.getElementById("zoom"),pageText=document.getElementById("page");' +
                        'var prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn");' +
                        'var touchStartX=0,touchStartY=0,touchStartDistance=0;' +
                        'function initImages(){var imgsDiv=document.getElementById("imgs");for(var i=0;i<urls.length;i++){(function(index){var img=document.createElement("img");img.src=urls[index];img.className="img";img.style.pointerEvents="auto";img.onclick=function(){openImage(index)};imgsDiv.appendChild(img)})(i)}}' +
                        'initImages();' +
                        'function openImage(index){currentIndex=index;pic.src=urls[index];light.className="on";zoom=1;updateZoom();updatePage()}' +
                        'close.onclick=function(){light.className=""};' +
                        'prevBtn.onclick=function(e){e.stopPropagation();previousImage()};' +
                        'nextBtn.onclick=function(e){e.stopPropagation();nextImage()};' +
                        'light.onclick=function(e){if(e.target===light){light.className=""}};' +
                        'document.onkeydown=function(e){if(light.className==="on"){if(e.key==="ArrowLeft"){previousImage();e.preventDefault()}else if(e.key==="ArrowRight"){nextImage();e.preventDefault()}else if(e.key==="Escape"){light.className=""}}};' +
                        'pic.onwheel=function(e){e.preventDefault();zoom*=e.deltaY>0?0.9:1.1;if(zoom<0.5)zoom=0.5;if(zoom>5)zoom=5;updateZoom()};' +
                        'pic.addEventListener("touchstart",function(e){if(e.touches.length===1){touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY}else if(e.touches.length===2){touchStartDistance=getDistance(e.touches[0],e.touches[1]);e.preventDefault()}},false);' +
                        'pic.addEventListener("touchmove",function(e){if(e.touches.length===2){var currentDistance=getDistance(e.touches[0],e.touches[1]);var scale=currentDistance/touchStartDistance;zoom*=scale;if(zoom<0.5)zoom=0.5;if(zoom>5)zoom=5;updateZoom();touchStartDistance=currentDistance;e.preventDefault()}},false);' +
                        'light.addEventListener("touchend",function(e){if(e.touches.length===0&&touchStartX!==0){var touchEndX=e.changedTouches[0].clientX;var diff=touchStartX-touchEndX;if(Math.abs(diff)>50){if(diff>0){nextImage()}else{previousImage()}}touchStartX=0;touchStartY=0}},false);' +
                        'function getDistance(touch1,touch2){var dx=touch1.clientX-touch2.clientX;var dy=touch1.clientY-touch2.clientY;return Math.sqrt(dx*dx+dy*dy)}' +
                        'function previousImage(){if(currentIndex>0){openImage(currentIndex-1)}}' +
                        'function nextImage(){if(currentIndex<urls.length-1){openImage(currentIndex+1)}}' +
                        'function updateZoom(){pic.style.transform="scale("+zoom+")";zoomText.textContent=Math.round(zoom*100)}' +
                        'function updatePage(){pageText.textContent=(currentIndex+1)+"/"+urls.length}' +
                    '<\/script>' +
                '</body>' +
                '</html>';
            
            return html;
        }
        
        function downloadHTML(html, filename) {
            var blob = new Blob([html], { type: 'text/html' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
